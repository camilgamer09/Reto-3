<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reto3</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            color: #000000;
        }

        h1 {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        p.instrucciones {
            color: #948787;
            font-size: 15px;
            margin-bottom: 15px;
        }

        .barra {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 35px;
        }

        .barra label {
            font-size: 16px;
            color: #555;
        }

        #taskInput {
            padding: 8px 10px;
            font-size: 14px;
            border: 1px solid #333;
            border-radius: 2px;
            outline: none;
            width: 220px;
        }

        .btn {
            background-color: #0066ff;
            color: white;
            border: none;
            padding: 9px 16px;
            font-size: 14px;
            border-radius: 5px;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #0052cc;
        }

        .area-resultado {
            display: flex;
            align-items: flex-start;
            gap: 15px;
        }

        #resultadoTextarea {
            width: 500px;
            height: 220px;
            border: 1px solid #999;
            border-radius: 8px;
            padding: 12px;
            font-size: 15px;
            color: #666;
            resize: none;
            outline: none;
            background-color: #fff;
        }

        #resultadoTextarea::placeholder {
            color: #888;
        }
    </style>
</head>
<body>

    <header>
        <h1>Ordenar Arrays de Cadenas</h1>
        <hr>
        <p class="instrucciones">Ingrese nombres en la caja de texto de abajo y ordene este listado el cual aparecerán en el área de texto</p>
    </header>

    <div class="barra">
        <label for="taskInput">Nombre:</label>
        <input type="text" id="taskInput">
        <button id="addBtn" class="btn">Agregar y ordenar nombre</button>
    </div>   

    <h1>Nombres ordenados</h1>
    <hr>
    
    <div class="area-resultado">
        <textarea id="resultadoTextarea" readonly placeholder="Aqui apareceran lo nombres ordenados"></textarea>
        <button id="clearBtn" class="btn">Limpiar</button>
    </div>
    <script src="reto3.js"></script>
</body>
</html>
